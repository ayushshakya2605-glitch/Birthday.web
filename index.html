<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* BACKGROUND */
.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 60% 38%,
        #fffaf3 0%,
        #ffe9dc 30%,
        #ffd0c2 65%,
        #ffb5aa 100%
    );
}

/* SOFT GLOW */
.scene::after{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    left:55%;
    top:8%;
    transform:translateX(-50%);

    background:radial-gradient(
        circle,
        rgba(255,255,255,.85),
        rgba(255,255,255,0) 70%
    );

    pointer-events:none;
}

/* TREE TRUNK */
.trunk{
    position:absolute;
    z-index:3;

    left:66%;
    bottom:-5px;

    width:18px;
    height:44vh;

    border-radius:20px;

    background:linear-gradient(
        90deg,
        #35130f,
        #6a2a20,
        #3a1511
    );
}

/* BRANCHES */
.branch{
    position:absolute;
    z-index:2;

    height:8px;
    border-radius:20px;

    background:#4a1b15;

    transform-origin:left center;
}

.branch1{
    left:66%;
    top:48%;
    width:190px;
    transform:rotate(-62deg);
}

.branch2{
    left:66%;
    top:43%;
    width:145px;
    transform:rotate(-105deg);
}

.branch3{
    left:66%;
    top:45%;
    width:150px;
    transform:rotate(-25deg);
}

/* HEART TREE */
.heart{
    position:absolute;
    z-index:4;

    left:66%;
    top:6%;

    width:390px;
    height:390px;

    transform:translateX(-50%);

    animation:pulse 3s ease-in-out infinite;
}

/* FLOWER */
.flower{
    position:absolute;

    width:27px;
    height:27px;

    border-radius:50%;

    background:
    radial-gradient(
        circle at center,
        #ffd84d 0 13%,
        transparent 14%
    ),
    radial-gradient(
        circle at 50% 12%,
        #ff4c91 0 35%,
        transparent 36%
    ),
    radial-gradient(
        circle at 88% 50%,
        #ff5d99 0 35%,
        transparent 36%
    ),
    radial-gradient(
        circle at 50% 88%,
        #ff4b8c 0 35%,
        transparent 36%
    ),
    radial-gradient(
        circle at 12% 50%,
        #ff6da0 0 35%,
        transparent 36%
    );

    filter:drop-shadow(
        0 2px 3px rgba(180,40,80,.18)
    );

    animation:flowerFloat 2.5s ease-in-out infinite;
}

/* ORANGE FLOWERS */
.flower.orange{
    background:
    radial-gradient(
        circle at center,
        #ffd85b 0 13%,
        transparent 14%
    ),
    radial-gradient(
        circle at 50% 12%,
        #ff7839 0 35%,
        transparent 36%
    ),
    radial-gradient(
        circle at 88% 50%,
        #ff9843 0 35%,
        transparent 36%
    ),
    radial-gradient(
        circle at 50% 88%,
        #ff713c 0 35%,
        transparent 36%
    ),
    radial-gradient(
        circle at 12% 50%,
        #ff8b3d 0 35%,
        transparent 36%
    );
}

/* HEART-SHAPED FLOWER POSITIONS */

.flower:nth-child(1){left:45%;top:2%}
.flower:nth-child(2){left:55%;top:2%}
.flower:nth-child(3){left:65%;top:5%}
.flower:nth-child(4){left:35%;top:8%}
.flower:nth-child(5){left:48%;top:10%}
.flower:nth-child(6){left:60%;top:10%}
.flower:nth-child(7){left:72%;top:12%}

.flower:nth-child(8){left:27%;top:17%}
.flower:nth-child(9){left:39%;top:18%}
.flower:nth-child(10){left:51%;top:18%}
.flower:nth-child(11){left:63%;top:19%}
.flower:nth-child(12){left:76%;top:21%}

.flower:nth-child(13){left:21%;top:27%}
.flower:nth-child(14){left:33%;top:27%}
.flower:nth-child(15){left:45%;top:28%}
.flower:nth-child(16){left:57%;top:28%}
.flower:nth-child(17){left:69%;top:29%}
.flower:nth-child(18){left:82%;top:31%}

.flower:nth-child(19){left:18%;top:37%}
.flower:nth-child(20){left:30%;top:38%}
.flower:nth-child(21){left:42%;top:38%}
.flower:nth-child(22){left:54%;top:39%}
.flower:nth-child(23){left:66%;top:40%}
.flower:nth-child(24){left:78%;top:41%}
.flower:nth-child(25){left:87%;top:43%}

.flower:nth-child(26){left:25%;top:47%}
.flower:nth-child(27){left:37%;top:48%}
.flower:nth-child(28){left:49%;top:49%}
.flower:nth-child(29){left:61%;top:49%}
.flower:nth-child(30){left:73%;top:51%}

.flower:nth-child(31){left:33%;top:57%}
.flower:nth-child(32){left:45%;top:58%}
.flower:nth-child(33){left:57%;top:58%}
.flower:nth-child(34){left:68%;top:60%}

.flower:nth-child(35){left:43%;top:67%}
.flower:nth-child(36){left:55%;top:67%}

/* BIRTHDAY TEXT */
.message{
    position:absolute;
    z-index:10;

    left:5%;
    bottom:10%;
}

.small{
    margin-left:5px;
    margin-bottom:4px;

    font-family:Georgia,serif;

    font-size:14px;

    color:#754848;
}

h1{
    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:clamp(48px,9vw,85px);

    font-weight:400;

    line-height:.9;

    color:#bd3168;

    text-shadow:
    0 2px 4px rgba(120,30,60,.15);
}

.sub{
    margin-top:10px;

    font-family:Georgia,serif;

    font-size:12px;

    color:#754848;
}

/* FLOATING PETALS */
.petal{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff6695;

    opacity:.35;

    animation:fall linear infinite;
}

/* ANIMATIONS */

@keyframes pulse{

    0%,100%{
        transform:translateX(-50%) scale(1);
    }

    20%{
        transform:translateX(-50%) scale(1.035);
    }

    40%{
        transform:translateX(-50%) scale(1);
    }

    60%{
        transform:translateX(-50%) scale(1.035);
    }

    80%{
        transform:translateX(-50%) scale(1);
    }
}

@keyframes flowerFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-3px);
    }
}

@keyframes fall{

    from{
        transform:translateY(-20px);
        opacity:0;
    }

    20%{
        opacity:.35;
    }

    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

/* MOBILE */
@media(max-width:600px){

    .heart{
        left:66%;
        top:9%;

        width:300px;
        height:300px;
    }

    .flower{
        width:20px;
        height:20px;
    }

    .trunk{
        left:66%;
        width:14px;
        height:40vh;
    }

    .branch1{
        left:66%;
        width:135px;
    }

    .branch2{
        left:66%;
        width:110px;
    }

    .branch3{
        left:66%;
        width:105px;
    }

    .message{
        left:5%;
        bottom:12%;
    }

    h1{
        font-size:52px;
    }

    .small{
        font-size:11px;
    }

    .sub{
        font-size:9px;
    }
}
</style>
</head>

<div class="scene">
