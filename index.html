<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift For Her</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0710;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: white;
      position: relative;
    }

    /* Floating Bubbles / Glowing Orbs in Background */
    .bubbles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -50px;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.8) 0%, rgba(168, 85, 247, 0.2) 70%);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.6);
      animation: floatUp 8s infinite linear;
    }

    .b1 { width: 25px; height: 25px; left: 15%; animation-duration: 7s; animation-delay: 0s; }
    .b2 { width: 15px; height: 15px; left: 35%; animation-duration: 9s; animation-delay: 2s; }
    .b3 { width: 30px; height: 30px; left: 55%; animation-duration: 6s; animation-delay: 1s; }
    .b4 { width: 20px; height: 20px; left: 75%; animation-duration: 10s; animation-delay: 3s; }
    .b5 { width: 12px; height: 12px; left: 85%; animation-duration: 8s; animation-delay: 4s; }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% {
        transform: translateY(-105vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Main Container */
    .container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* Step 1: Tap to Open */
    .tap-btn {
      cursor: pointer;
      text-align: center;
      z-index: 10;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .tap-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }

    .tap-text {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 25px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .heart-icon {
      width: 50px;
      height: 50px;
      background-color: #a855f7;
      display: inline-block;
      transform: rotate(-45deg);
      position: relative;
      animation: pulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 25px #a855f7;
      margin-top: 10px;
    }

    .heart-icon::before,
    .heart-icon::after {
      content: "";
      width: 50px;
      height: 50px;
      background-color: #a855f7;
      border-radius: 50%;
      position: absolute;
    }

    .heart-icon::before { top: -25px; left: 0; }
    .heart-icon::after { left: 25px; top: 0; }

    @keyframes pulse {
      0%, 100% { transform: rotate(-45deg) scale(1); }
      50% { transform: rotate(-45deg) scale(1.2); }
    }

    /* Step 2 & 3: Content Reveal */
    .content {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease-in-out, visibility 1s;
    }

    .content.visible {
      opacity: 1;
      visibility: visible;
    }

    .title {
      font-size: 30px;
      color: #e9d5ff;
      margin-top: 30px;
      font-family: 'Georgia', serif;
      text-shadow: 0 0 12px rgba(233, 213, 255, 0.7);
    }

    /* Flowers Bouquet Animation */
    .flowers-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin-top: 20px;
    }

    .flower {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 16px;
      height: 130px;
      background-image: linear-gradient(to bottom, #38f2ff, #16a1f8, #1a2a3a 99%);
      clip-path: ellipse(50% 50% at 50% 50%);
      transform-origin: center bottom;
      opacity: 0;
    }

    .content.visible .flower {
      animation: open-flower 2s 0.5s forwards ease-out;
    }

    .f1 { transform: translateX(-50%) rotate(-32deg); }
    .f2 { transform: translateX(-50%) rotate(-16deg); }
    .f3 { transform: translateX(-50%) rotate(0deg); }
    .f4 { transform: translateX(-50%) rotate(16deg); }
    .f5 { transform: translateX(-50%) rotate(32deg); }

    .flower-top {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 26px;
      background: #c084fc;
      border-radius: 50%;
      box-shadow: 0 0 12px #e9d5ff;
    }

    @keyframes open-flower {
      0% {
        height: 0;
        opacity: 0;
      }
      100% {
        height: 130px;
        opacity: 1;
      }
    }

    /* Envelope & Card Reveal */
    .envelope-wrapper {
      position: relative;
      margin-top: 30px;
      cursor: pointer;
    }

    .envelope {
      width: 220px;
      height: 140px;
      background: #f472b6;
      border-radius: 0 0 8px 8px;
      position: relative;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      border-left: 110px solid #ec4899;
      border-right: 110px solid #ec4899;
      border-top: 70px solid transparent;
      border-bottom: 70px solid #db2777;
      border-radius: 0 0 8px 8px;
      z-index: 2;
    }

    .card {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      background: #ffffff;
      color: #333;
      padding: 12px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.8s ease-in-out;
      z-index: 1;
      text-align: center;
      font-size: 11px;
      line-height: 1.4;
    }

    .envelope-wrapper.open .card {
      transform: translateX(-50%) translateY(-90px);
      z-index: 3;
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 4px;
      color: #111;
    }
  </style>
</head>
<body>

  <!-- Floating Background Orbs / Bubbles -->
  <div class="bubbles">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
  </div>

  <div class="container">
    <!-- Step 1: Tap To Open -->
    <div class="tap-btn" id="tapBtn">
      <div class="tap-text">TAP TO OPEN</div>
      <div class="heart-icon"></div>
    </div>

    <!-- Step 2 & 3: Revealed Flowers and Envelope -->
    <div class="content" id="mainContent">
      <h2 class="title">Flowers For You</h2>

      <!-- Flowers Bouquet -->
      <div class="flowers-container">
        <div class="flower f1"><div class="flower-top"></div></div>
        <div class="flower f2"><div class="flower-top"></div></div>
        <div class="flower f3"><div class="flower-top"></div></div>
        <div class="flower f4"><div class="flower-top"></div></div>
        <div class="flower f5"><div class="flower-top"></div></div>
      </div>

      <!-- Letter / Card Envelope -->
      <div class="envelope-wrapper" id="envelope">
        <div class="envelope"></div>
        <div class="card">
          <div class="card-title">Dear Love,</div>
          <p>Wishing you a wonderful day filled with joy and happiness!</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tapBtn = document.getElementById('tapBtn');
    const mainContent = document.getElementById('mainContent');
    const envelope = document.getElementById('envelope');

    // Click to Open Action
    tapBtn.addEventListener('click', () => {
      tapBtn.classList.add('hidden');
      mainContent.classList.add('visible');
    });

    // Click Envelope to Open Letter Card
    envelope.addEventListener('click', () => {
      envelope.classList.toggle('open');
    });
  </script>

</body>
</html>
