<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift For Her</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0710;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: white;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tap to Open Section */
    .tap-btn {
      cursor: pointer;
      text-align: center;
      z-index: 10;
      transition: opacity 0.5s, transform 0.5s;
    }

    .tap-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }

    .tap-text {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .heart-icon {
      width: 60px;
      height: 60px;
      background-color: #a855f7;
      display: inline-block;
      transform: rotate(-45deg);
      position: relative;
      animation: pulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 25px #a855f7;
    }

    .heart-icon::before,
    .heart-icon::after {
      content: "";
      width: 60px;
      height: 60px;
      background-color: #a855f7;
      border-radius: 50%;
      position: absolute;
    }

    .heart-icon::before {
      top: -30px;
      left: 0;
    }

    .heart-icon::after {
      left: 30px;
      top: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: rotate(-45deg) scale(1); }
      50% { transform: rotate(-45deg) scale(1.15); }
    }

    /* Flowers & Card Content */
    .content {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease-in-out, visibility 1s;
    }

    .content.visible {
      opacity: 1;
      visibility: visible;
    }

    .title {
      font-size: 28px;
      color: #e9d5ff;
      margin-top: 20px;
      font-family: 'Georgia', serif;
      text-shadow: 0 0 10px rgba(233, 213, 255, 0.5);
    }

    /* Flowers Bouquet Styles */
    .flowers-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin-top: 30px;
    }

    .flower {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 120px;
      background-image: linear-gradient(to bottom, #38f2ff, #16a1f8, #1a2a3a 99%);
      clip-path: ellipse(50% 50% at 50% 50%);
      transform-origin: center bottom;
      animation: open-flower 2s 1s backwards;
    }

    .f1 { transform: translateX(-50%) rotate(-30deg); }
    .f2 { transform: translateX(-50%) rotate(-15deg); }
    .f3 { transform: translateX(-50%) rotate(0deg); }
    .f4 { transform: translateX(-50%) rotate(15deg); }
    .f5 { transform: translateX(-50%) rotate(30deg); }

    .flower-top {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
      background: #c084fc;
      border-radius: 50%;
      box-shadow: 0 0 15px #e9d5ff;
    }

    @keyframes open-flower {
      0% { height: 0; opacity: 0; }
      100% { height: 120px; opacity: 1; }
    }

    /* Envelope & Card Styles */
    .envelope-wrapper {
      position: relative;
      margin-top: 40px;
      cursor: pointer;
    }

    .envelope {
      width: 240px;
      height: 150px;
      background: #f472b6;
      border-radius: 0 0 10px 10px;
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      border-left: 120px solid #ec4899;
      border-right: 120px solid #ec4899;
      border-top: 80px solid transparent;
      border-bottom: 70px solid #db2777;
      border-radius: 0 0 10px 10px;
      z-index: 2;
    }

    .card {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 210px;
      background: white;
      color: #333;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.8s ease-in-out;
      z-index: 1;
      text-align: center;
      font-size: 11px;
      line-height: 1.4;
    }

    .envelope-wrapper.open .card {
      transform: translateX(-50%) translateY(-100px);
      z-index: 3;
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 5px;
      color: #111;
    }

    .card-img {
      width: 80px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tap to Open Button -->
    <div class="tap-btn" id="tapBtn">
      <div class="tap-text">TAP TO OPEN</div>
      <div class="heart-icon"></div>
    </div>

    <!-- Hidden Content Revealed on Tap -->
    <div class="content" id="mainContent">
      <h2 class="title">Flowers For You</h2>

      <!-- Flowers -->
      <div class="flowers-container">
        <div class="flower f1"><div class="flower-top"></div></div>
        <div class="flower f2"><div class="flower-top"></div></div>
        <div class="flower f3"><div class="flower-top"></div></div>
        <div class="flower f4"><div class="flower-top"></div></div>
        <div class="flower f5"><div class="flower-top"></div></div>
      </div>

      <!-- Card Envelope -->
      <div class="envelope-wrapper" id="envelope">
        <div class="envelope"></div>
        <div class="card">
          <div class="card-title">Dear Love,</div>
          <p>Wishing you a day filled with happiness and love. You are very special!</p>
          <img class="card-img" src="https://via.placeholder.com/80x60?text=Bears" alt="Cute Bears">
        </div>
      </div>
    </div>
  </div>

  <script>
    const tapBtn = document.getElementById('tapBtn');
    const mainContent = document.getElementById('mainContent');
    const envelope = document.getElementById('envelope');

    tapBtn.addEventListener('click', () => {
      tapBtn.classList.add('hidden');
      mainContent.classList.add('visible');
    });

    envelope.addEventListener('click', () => {
      envelope.classList.toggle('open');
    });
  </script>

</body>
</html>
