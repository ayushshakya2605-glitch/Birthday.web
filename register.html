<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Earn2605</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#eff6ff,#faf5ff);
  padding:20px;
}
.card {
  background:#fff; border-radius:20px;
  box-shadow:0 20px 60px rgba(15,23,42,0.1);
  padding:40px 28px; max-width:420px; width:100%;
}
.logo {
  display:flex; align-items:center; justify-content:center;
  gap:10px; margin-bottom:24px;
  font-size:1.4rem; font-weight:800; color:#0f172a;
}
.logo-mark {
  width:40px; height:40px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:800;
}
.logo span { color:#2563eb; }
h2 { font-size:1.5rem; font-weight:800; text-align:center; margin-bottom:8px; color:#0f172a; }
.sub { text-align:center; color:#64748b; margin-bottom:28px; font-size:0.9rem; }
.form-group { margin-bottom:16px; }
label { display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:6px; }
input {
  width:100%; padding:12px 16px;
  border:1.5px solid #e2e8f0; border-radius:10px;
  font-family:inherit; font-size:0.95rem;
  background:#f8fafc;
}
input:focus { outline:none; border-color:#2563eb; background:#fff; }
.btn {
  width:100%; padding:14px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff; border:none; border-radius:10px;
  font-family:inherit; font-size:1rem; font-weight:600;
  cursor:pointer; margin-top:8px;
}
.btn:disabled { opacity:0.6; cursor:not-allowed; }
.switch { text-align:center; margin-top:20px; font-size:0.9rem; color:#64748b; }
.switch a { color:#2563eb; font-weight:600; text-decoration:none; }
.alert { padding:12px; border-radius:10px; font-size:0.9rem; margin-bottom:16px; display:none; }
.alert-error { background:#fee2e2; color:#991b1b; }
.alert-success { background:#dcfce7; color:#166534; }
.alert.show { display:block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-mark">E</div>Earn<span>2605</span></div>
  <h2>Create Account</h2>
  <p class="sub">Join Earn2605 and start earning</p>
  <div class="alert alert-error" id="err"></div>
  <div class="alert alert-success" id="ok"></div>
  <form id="regForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your name" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="tel" id="phone" placeholder="10-digit number" pattern="[0-9]{10}" maxlength="10" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Create Account</button>
  </form>
  <div class="switch">Already have account? <a href="login.html">Login</a></div>
</div>
<script>
// ⚠️⚠️⚠️ YAHAN APNA GOOGLE APPS SCRIPT URL PASTE KARO ⚠️⚠️⚠️
var SCRIPT_URL = '';

var form = document.getElementById('regForm');
var err = document.getElementById('err');
var ok = document.getElementById('ok');
var submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e){
  e.preventDefault();
  
  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var phone = document.getElementById('phone').value.trim();
  var password = document.getElementById('password').value;
  
  err.classList.remove('show');
  ok.classList.remove('show');
  
  if (!name) { showErr('Please enter your name'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Invalid email address'); return; }
  if (!/^\d{10}$/.test(phone)) { showErr('Enter valid 10-digit mobile number'); return; }
  if (password.length < 6) { showErr('Password must be at least 6 characters'); return; }
  
  if (!SCRIPT_URL || SCRIPT_URL.indexOf('script.google.com') === -1) {
    showErr('Server not configured. Please contact admin.');
    return;
  }
  
  var users = JSON.parse(localStorage.getItem('earn2605_users') || '[]');
  if (users.find(function(u){ return u.email === email; })) {
    showErr('This email is already registered. Please login.');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating...';
  ok.textContent = 'Creating your account...';
  ok.classList.add('show');
  
  var params = '?action=register' +
    '&name=' + encodeURIComponent(name) +
    '&email=' + encodeURIComponent(email) +
    '&phone=' + encodeURIComponent(phone) +
    '&password=' + encodeURIComponent(password) +
    '&t=' + Date.now();
  
  fetch(SCRIPT_URL + params)
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.status === 'duplicate') {
        showErr('This email is already registered. Please login.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
        return;
      }
      if (res.status === 'error') {
        showErr('Registration failed. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
        return;
      }
      
      users.push({ name: name, email: email, phone: phone, password: password });
      localStorage.setItem('earn2605_users', JSON.stringify(users));
      ok.textContent = 'Account created! Redirecting to login...';
      setTimeout(function(){ window.location.href = 'login.html'; }, 1500);
    })
    .catch(function() {
      users.push({ name: name, email: email, phone: phone, password: password });
      localStorage.setItem('earn2605_users', JSON.stringify(users));
      ok.textContent = 'Account created! Redirecting...';
      setTimeout(function(){ window.location.href = 'login.html'; }, 1500);
    });
});

function showErr(msg) {
  err.textContent = msg;
  err.classList.add('show');
  ok.classList.remove('show');
}
</script>
</body>
</html>
