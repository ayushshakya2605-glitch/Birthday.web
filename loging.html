<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Earn2605</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#eff6ff,#faf5ff);
  padding:20px;
}
.card {
  background:#fff; border-radius:20px;
  box-shadow:0 20px 60px rgba(15,23,42,0.1);
  padding:40px 28px; max-width:420px; width:100%;
}
.logo {
  display:flex; align-items:center; justify-content:center;
  gap:10px; margin-bottom:24px;
  font-size:1.4rem; font-weight:800; color:#0f172a;
}
.logo-mark {
  width:40px; height:40px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:800;
}
.logo span { color:#2563eb; }
h2 { font-size:1.5rem; font-weight:800; text-align:center; margin-bottom:8px; color:#0f172a; }
.sub { text-align:center; color:#64748b; margin-bottom:28px; font-size:0.9rem; }
.form-group { margin-bottom:16px; }
label { display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:6px; }
input {
  width:100%; padding:12px 16px;
  border:1.5px solid #e2e8f0; border-radius:10px;
  font-family:inherit; font-size:0.95rem;
  background:#f8fafc;
}
input:focus { outline:none; border-color:#2563eb; background:#fff; }
.btn {
  width:100%; padding:14px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff; border:none; border-radius:10px;
  font-family:inherit; font-size:1rem; font-weight:600;
  cursor:pointer; margin-top:8px;
}
.switch { text-align:center; margin-top:20px; font-size:0.9rem; color:#64748b; }
.switch a { color:#2563eb; font-weight:600; text-decoration:none; }
.alert { padding:12px; border-radius:10px; font-size:0.9rem; margin-bottom:16px; display:none; }
.alert-error { background:#fee2e2; color:#991b1b; }
.alert.show { display:block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-mark">E</div>Earn<span>2605</span></div>
  <h2>Welcome Back</h2>
  <p class="sub">Login to your Earn2605 account</p>
  <div class="alert alert-error" id="err"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn">Login</button>
  </form>
  <div class="switch">Don't have an account? <a href="register.html">Register</a></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var password = document.getElementById('password').value;
  var err = document.getElementById('err');
  err.classList.remove('show');
  var users = JSON.parse(localStorage.getItem('earn2605_users') || '[]');
  var user = users.find(function(u){ return u.email === email && u.password === password; });
  if (!user) {
    err.textContent = '❌ Invalid email or password';
    err.classList.add('show');
    return;
  }
  localStorage.setItem('earn2605_currentUser', JSON.stringify(user));
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
